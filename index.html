};
const items = {};
for (const k in itemsRaw) items[k] = itemsRaw[k].split(';').map(x => x.split('|'));

const $ = id => document.getElementById(id);
let current = null;

// subject cards
$('cards').innerHTML = subjects.map(s => `
  <button data-id="${s.id}" class="card text-left bg-white rounded-xl border-2 border-slate-200 p-6 hover:border-slate-900 focus:outline-none focus-visible:ring-2 focus-visible:ring-slate-900 transition-colors">
    <span class="block w-10 h-1.5 rounded ${s.color} mb-4"></span>
    <span class="block text-xl font-bold text-slate-900">${s.name}</span>
    <span class="block text-slate-600 mt-1">${s.bn}</span>
    <span class="block mt-4 text-sm font-medium text-slate-500">${s.topics.length}টি টপিক</span>
  </button>`).join('');

function esc(t){return t.replace(/&/g,'&amp;').replace(/</g,'&lt;')}

function renderTopics(q=''){
  const s = current, term = q.trim().toLowerCase();
  const list = s.topics.filter(([t,d]) => (t+' '+(bn[t]||'')+' '+(items[t]||[]).flat().join(' ')).toLowerCase().includes(term));
  $('topics').innerHTML = list.map(([t,d],i) => `
    <li class="py-5 flex gap-4">
      <span class="shrink-0 w-9 h-9 rounded-full ${s.color} text-white font-bold flex items-center justify-center">${s.topics.findIndex(x=>x[0]===t)+1}</span>
      <div>
        <h3 class="text-xl font-extrabold text-slate-900">${esc(t)} <span class="font-bold text-slate-500">--&gt;</span> <span class="font-extrabold">(${esc(bn[t]||t)})</span></h3>
        <ul class="mt-3 list-disc pl-5 space-y-1.5 text-slate-700 leading-relaxed marker:text-slate-400">
          ${(items[t]||[[d,'']]).map(([e,b]) => `<li><span class="font-semibold text-slate-900">${esc(e)}</span> --&gt; (${esc(b)})</li>`).join('')}
        </ul>
      </div>
    </li>`).join('');
  $('empty').classList.toggle('hidden', list.length>0);
  $('notes').innerHTML = (s.notes && !term) ? `
    <div class="rounded-xl bg-slate-100 p-5">
      <h3 class="font-bold text-slate-900">মন্তব্য</h3>
      <ul class="mt-2 list-disc pl-5 space-y-1 text-slate-700">${s.notes.map(n=>`<li>${n}</li>`).join('')}</ul>
    </div>` : '';
}

function open(id){
  current = subjects.find(s => s.id===id);
  document.querySelectorAll('.card').forEach(c => {
    const on = c.dataset.id===id;
    c.classList.toggle('border-slate-900', on);
    c.classList.toggle('border-slate-200', !on);
  });
  $('panelHead').className = 'px-6 py-8 text-white ' + current.color;
  $('panelHead').innerHTML = `<h2 class="text-2xl sm:text-3xl font-bold">${current.name}</h2><p class="mt-1 opacity-90">${current.bn} · মোট ${current.topics.length}টি টপিক</p>`;
  $('search').value='';
  renderTopics();
  $('panel').classList.remove('hidden');
  $('hint').classList.add('hidden');
  $('detail').scrollIntoView({behavior:'smooth'});
}

$('cards').addEventListener('click', e => {
  const b = e.target.closest('.card'); if(b) open(b.dataset.id);
});
$('search').addEventListener('input', e => renderTopics(e.target.value));
</script>
</body>
</html>
